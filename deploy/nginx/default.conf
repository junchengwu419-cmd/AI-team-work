server {
    listen 80;
    server_name labstore.icu;
    return 302 https://labstore.icu$request_uri;
}
server {
    listen 127.0.0.1:8080;
    server_name localhost labstore.icu;

    charset utf-8;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}
