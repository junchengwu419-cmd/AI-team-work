<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>在线实验室</title>
  <style>
    body {
      max-width: 1000px;
      margin: 24px auto;
      padding: 0 16px;
      font-family: sans-serif;
    }

    #editor {
      height: 400px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 16px;
      padding: 8px 16px;
    }

    pre {
      padding: 12px;
      background: #f3f4f6;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>在线实验室</h1>
<fieldset id="file-controls">
  <legend>代码文件</legend>

  <label for="file-select">当前文件</label>
  <select id="file-select">
    <option value="main.cpp">main.cpp</option>
  </select>

  <label for="new-file-name">新文件名</label>
  <input
    id="new-file-name"
    type="text"
    placeholder="例如 calc.cpp"
    maxlength="128"
  >

  <button id="add-file" type="button">添加文件</button>
  <button id="delete-file" type="button">删除当前文件</button>
</fieldset>
  <div id="editor"></div>

  <button id="read-code" type="button">读取编辑器代码</button>
  <pre id="result">点击按钮后，在这里显示代码。</pre>
  <h2>运行程序</h2>

  <label for="stdin">标准输入</label>
  <textarea id="stdin" rows="3">3 5</textarea>

  <button id="run-code" type="button">运行 C++</button>
  <p id="run-status" role="status">等待运行</p>

  <h2>标准输出</h2>
  <pre id="stdout"></pre>

  <h2>错误信息</h2>
  <pre id="stderr"></pre>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
