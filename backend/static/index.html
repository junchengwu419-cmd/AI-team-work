<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>在线实验室连接测试</title>
</head>
<body>
  <h1>在线实验室</h1>
  <p>点击按钮，检查网页是否能够访问后端。</p>

  <button id="check-button" type="button">检查连接</button>
  <pre id="result">尚未检查</pre>

  <script>
    const button = document.querySelector("#check-button");
    const result = document.querySelector("#result");

    button.addEventListener("click", async () => {
      button.disabled = true;
      result.textContent = "正在连接后端……";

      try {
        const response = await fetch("/api/ping");

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (data.ok !== true) {
          throw new Error("后端返回的内容不符合约定");
        }

        result.textContent = "后端连接成功\n" +
          JSON.stringify(data, null, 2);
      } catch (error) {
        result.textContent = "连接失败：" + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
