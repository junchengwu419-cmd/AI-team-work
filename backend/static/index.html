<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>在线实验室</title>
  <style>
    body { max-width: 960px; margin: 32px auto; padding: 0 20px; font-family: sans-serif; line-height: 1.6; }
    label { display: block; font-weight: bold; margin-top: 16px; }
    textarea { display: block; box-sizing: border-box; width: 100%; padding: 12px; font-family: monospace; font-size: 15px; }
    button { padding: 8px 16px; margin: 12px 8px 0 0; cursor: pointer; }
    button:disabled { cursor: wait; }
    pre { min-height: 32px; background: #f3f4f6; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    #status { font-weight: bold; }
    #file-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    #file-tabs button[aria-pressed="true"] { background: #174ea6; color: white; }
    #file-name { padding: 8px; }
  </style>
</head>
<body>
  <h1>在线实验室</h1>
  <p>添加并编辑 .cpp 和 .h 文件，点击运行时将一起提交。</p>
  <div id="file-tabs" aria-label="项目文件"></div>
  <label for="file-name">新文件名</label>
  <input id="file-name" placeholder="例如 calc.cpp 或 calc.h" maxlength="128">
  <button id="add-file" type="button">添加文件</button>
  <button id="delete-file" type="button">删除当前文件</button>
  <p>切换文件时会保留本页中的修改；刷新或关闭页面会丢失代码，请另行保存。</p>

  <label id="source-label" for="source">main.cpp</label>
  <textarea id="source" rows="12" spellcheck="false">#include &lt;iostream&gt;

int main() {
    int a, b;
    std::cin &gt;&gt; a &gt;&gt; b;
    std::cout &lt;&lt; a + b &lt;&lt; '\n';
    return 0;
}
</textarea>

  <label for="stdin">标准输入</label>
  <textarea id="stdin" rows="3" spellcheck="false">3 5</textarea>

  <button id="run-button" type="button">运行 C++</button>
  <button id="check-button" type="button">检查连接</button>
  <p id="connection" role="status">尚未检查连接</p>
  <p id="status" role="status">等待运行</p>
  <p id="details"></p>

  <h2>标准输出</h2>
  <pre id="stdout">尚无结果</pre>
  <h2>错误信息</h2>
  <pre id="stderr">尚无结果</pre>

  <script>
    const source = document.querySelector("#source");
    const stdin = document.querySelector("#stdin");
    const runButton = document.querySelector("#run-button");
    const checkButton = document.querySelector("#check-button");
    const connection = document.querySelector("#connection");
    const status = document.querySelector("#status");
    const details = document.querySelector("#details");
    const stdout = document.querySelector("#stdout");
    const stderr = document.querySelector("#stderr");
    const tabs = document.querySelector("#file-tabs");
    const fileName = document.querySelector("#file-name");
    const addFile = document.querySelector("#add-file");
    const deleteFile = document.querySelector("#delete-file");
    const sourceLabel = document.querySelector("#source-label");
    const files = new Map([["main.cpp", source.value]]);
    let activeFile = "main.cpp";
    let busy = false;

    function renderTabs() {
      tabs.replaceChildren();
      for (const name of files.keys()) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = name;
        button.setAttribute("aria-pressed", String(name === activeFile));
        button.disabled = busy;
        button.addEventListener("click", () => {
          files.set(activeFile, source.value);
          activeFile = name;
          source.value = files.get(name);
          renderTabs();
        });
        tabs.append(button);
      }
      sourceLabel.textContent = activeFile;
      deleteFile.disabled = busy || files.size === 1;
    }

    function setBusy(value) {
      busy = value;
      for (const control of [runButton, source, stdin, fileName, addFile]) {
        control.disabled = value;
      }
      renderTabs();
    }

    source.addEventListener("input", () => files.set(activeFile, source.value));
    addFile.addEventListener("click", () => {
      const name = fileName.value.trim();
      if (!/^[A-Za-z0-9_.-]{1,128}$/.test(name) || !/\.(cpp|h)$/.test(name)) {
        status.textContent = "文件名请使用英文字母、数字、下划线、短横线或点，并以 .cpp 或 .h 结尾";
        return;
      }
      if (files.has(name)) {
        status.textContent = "已经有同名文件，请换一个名称";
        return;
      }
      if (files.size >= 10) {
        status.textContent = "最多添加 10 个文件";
        return;
      }
      files.set(activeFile, source.value);
      files.set(name, "");
      activeFile = name;
      source.value = "";
      fileName.value = "";
      renderTabs();
      status.textContent = "已添加 " + name;
      source.focus();
    });
    deleteFile.addEventListener("click", () => {
      if (files.size === 1 || busy) return;
      if (!confirm("确定删除 " + activeFile + "？该文件的代码将被移除。")) return;
      files.delete(activeFile);
      activeFile = files.keys().next().value;
      source.value = files.get(activeFile);
      renderTabs();
      status.textContent = "已删除文件";
    });
    renderTabs();

    async function readJson(response) {
      const text = await response.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch {
        throw new Error(`HTTP ${response.status}：服务没有返回 JSON，请检查后端及 Nginx`);
      }
      if (data === null || typeof data !== "object" || Array.isArray(data)) {
        throw new Error("服务返回的内容不符合接口约定");
      }
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}：${data.message || data.error || "请求失败"}`);
      }
      return data;
    }

    checkButton.addEventListener("click", async () => {
      checkButton.disabled = true;
      connection.textContent = "正在检查连接……";
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 10000);
      try {
        const response = await fetch("/api/ping", { signal: controller.signal });
        const data = await readJson(response);
        if (data.ok !== true) throw new Error("健康检查结果不符合约定");
        connection.textContent = "后端连接成功";
      } catch (error) {
        connection.textContent = error.name === "AbortError"
          ? "连接检查超时，请检查服务与 SSH 连接"
          : "连接检查失败：" + error.message;
      } finally {
        clearTimeout(timer);
        checkButton.disabled = false;
      }
    });

    runButton.addEventListener("click", async () => {
      files.set(activeFile, source.value);
      if (![...files].some(([name, content]) => name.endsWith(".cpp") && content.trim())) {
        status.textContent = "请至少提供一个包含代码的 .cpp 文件";
        return;
      }
      const payload = {
        files: [...files].map(([name, content]) => ({ name, content })),
        stdin: stdin.value,
      };

      setBusy(true);
      status.textContent = "正在提交并编译运行……";
      details.textContent = "";
      stdout.textContent = "";
      stderr.textContent = "";
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 30000);

      try {
        const response = await fetch("/api/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          signal: controller.signal,
        });
        const data = await readJson(response);
        if (typeof data.stdout !== "string" || typeof data.stderr !== "string" ||
            !Number.isInteger(data.exitCode) || !Number.isFinite(data.time) ||
            !["compile", "run"].includes(data.stage)) {
          throw new Error("执行结果字段不符合接口约定");
        }

        stdout.textContent = data.stdout || "（无标准输出）";
        stderr.textContent = data.stderr || "（无错误信息）";
        const phase = data.stage === "compile" ? "编译" : "运行";
        details.textContent = `阶段：${phase}；退出码：${data.exitCode}；耗时：${data.time} 毫秒`;
        if (data.exitCode === 0) {
          status.textContent = "执行成功";
        } else if (data.exitCode === 124) {
          status.textContent = `${phase}超时`;
        } else {
          status.textContent = `${phase}失败，请查看错误信息`;
        }
      } catch (error) {
        status.textContent = "请求未完成";
        stderr.textContent = error.name === "AbortError"
          ? "浏览器等待超过 30 秒。请检查连接和服务；不要连续重复提交。"
          : error.message;
      } finally {
        clearTimeout(timer);
        setBusy(false);
      }
    });
  </script>
</body>
</html>
