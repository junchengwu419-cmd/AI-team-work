<h2>发布课堂题目</h2>
<form id="problem-publish" method="post" action="/api/problems" autocomplete="off">
  <fieldset id="problem-fields">
    <legend>题目与公开用例</legend>
    <label>教师发布口令 <input name="token" type="password" required></label>
    <label>题目标题 <input name="title" type="text" maxlength="120" required></label>
    <label>题目说明 <textarea name="description" rows="4" maxlength="4000" required></textarea></label>
    <div id="problem-cases"></div>
    <button id="case-add" type="button">添加用例</button>
    <button type="submit">发布题目</button>
  </fieldset>
  <p id="publish-status" role="status"></p>
</form>
<template id="problem-case-template">
  <fieldset class="problem-case">
    <legend>公开用例</legend>
    <label>标准输入 <textarea class="case-stdin" rows="2" maxlength="4000"></textarea></label>
    <label>预期输出 <textarea class="case-expected" rows="2" maxlength="4000"></textarea></label>
    <button class="case-remove" type="button">移除此用例</button>
  </fieldset>
</template>
